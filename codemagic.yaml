workflows:
  hafsa-traders-debug:
    name: Hafsa Traders Debug APK
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.hafsatraders.app"
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  hafsa-traders-release:
    name: Hafsa Traders Release APK and AAB
    max_build_duration: 60
    environment:
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: "com.hafsatraders.app"
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build signed Release APK and AAB
        script: |
          ./gradlew clean assembleRelease bundleRelease --no-daemon
      - name: Verify release signing and name APK
        script: |
          set -e
          APK="$CM_BUILD_DIR/app/build/outputs/apk/release/app-release.apk"
          AAB="$CM_BUILD_DIR/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed release APK was not generated."
            exit 1
          fi
          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/hafsatraders.apk"
          cp "$AAB" "$CM_BUILD_DIR/artifacts/hafsatraders.aab"
          echo "Signed APK created: artifacts/hafsatraders.apk"
          echo "Signed AAB created: artifacts/hafsatraders.aab"
    artifacts:
      - artifacts/hafsatraders.apk
      - artifacts/hafsatraders.aab
