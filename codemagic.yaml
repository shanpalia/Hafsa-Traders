workflows:
  hafsa-traders-debug:
    name: Hafsa Traders Debug APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: "com.hafsatraders.app"
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk


  hafsa-traders-release:
    name: Hafsa Traders Release APK & AAB
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: "com.hafsatraders.app"
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Release APK and AAB
        script: |
          ./gradlew assembleRelease bundleRelease --no-daemon

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
