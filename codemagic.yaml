workflows:
  hafsa-traders-release:
    name: Hafsa Traders Signed APK
    max_build_duration: 60
    environment:
      android_signing:
        - paliaapk-release
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - $CM_BUILD_DIR/.gradle-dist
    scripts:
      - name: Prepare Android SDK and clean duplicate icons
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          find "$CM_BUILD_DIR/app/src/main/res" -type f -name 'ic_launcher.webp' -delete
          find "$CM_BUILD_DIR/app/src/main/res" -type f -name 'ic_launcher_round.webp' -delete
      - name: Install Gradle 9.3.1
        script: |
          set -e
          DIST="$CM_BUILD_DIR/.gradle-dist"
          GRADLE="$DIST/gradle-9.3.1/bin/gradle"
          mkdir -p "$DIST"
          if [ ! -x "$GRADLE" ]; then
            curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$CM_BUILD_DIR/gradle-9.3.1-bin.zip"
            rm -rf "$DIST/gradle-9.3.1"
            unzip -q -o "$CM_BUILD_DIR/gradle-9.3.1-bin.zip" -d "$DIST"
            chmod +x "$GRADLE"
            rm -f "$CM_BUILD_DIR/gradle-9.3.1-bin.zip"
          fi
      - name: Verify Gradle version
        script: |
          set -e
          "$CM_BUILD_DIR/.gradle-dist/gradle-9.3.1/bin/gradle" --version
      - name: Build signed Release APK only
        script: |
          set -e
          "$CM_BUILD_DIR/.gradle-dist/gradle-9.3.1/bin/gradle" clean assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed release APK was not produced."
            exit 1
          fi
          mkdir -p app/build/outputs/apk/release/final
          cp "$APK" app/build/outputs/apk/release/final/hafsatraders.apk
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose app/build/outputs/apk/release/final/hafsatraders.apk
          elif [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" ]; then
            APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/final/hafsatraders.apk
          else
            echo "ERROR: apksigner was not found; refusing to publish an unverified APK."
            exit 1
          fi
    artifacts:
      - app/build/outputs/apk/release/final/hafsatraders.apk
