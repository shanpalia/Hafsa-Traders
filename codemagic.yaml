workflows:
  hafsa-traders-release:
    name: Hafsa Traders Signed APK
    max_build_duration: 60
    environment:
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: "com.hafsatraders.app"
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Prepare Gradle 9.3.1 and signing
        script: |
          set -e
          chmod +x ./gradlew

          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "ERROR: CodeMagic keystore 'paliaapk-release' was not attached."
            exit 1
          fi
          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || [ -z "${CM_KEY_ALIAS:-}" ] || [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: CodeMagic signing variables are missing."
            exit 1
          fi

          GRADLE_VERSION=9.3.1
          DIST_DIR="$CM_BUILD_DIR/.gradle-dist"
          GRADLE_HOME="$DIST_DIR/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$DIST_DIR"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$DIST_DIR/gradle-${GRADLE_VERSION}-bin.zip"
            rm -rf "$GRADLE_HOME"
            unzip -q "$DIST_DIR/gradle-${GRADLE_VERSION}-bin.zip" -d "$DIST_DIR"
          fi
          "$GRADLE_HOME/bin/gradle" --version

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build signed Release APK
        script: |
          set -e
          GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-9.3.1"
          "$GRADLE_HOME/bin/gradle" clean assembleRelease --no-daemon --stacktrace

      - name: Verify and rename signed APK
        script: |
          set -e
          APK="$CM_BUILD_DIR/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not generated."
            echo "Available APK files:"
            find "$CM_BUILD_DIR/app/build/outputs" -type f -name '*.apk' -print || true
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/hafsatraders.apk"
          echo "SIGNED APK: $CM_BUILD_DIR/artifacts/hafsatraders.apk"

    artifacts:
      - artifacts/hafsatraders.apk
